[package]
name = "pocket-assistant"
version = "0.1.0"
description = "Pocket Assistant: the desktop app (tray and dashboard window, a viewer of the cloud engine)"
edition = "2021"
publish = false

[lib]
name = "pocket_assistant_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
