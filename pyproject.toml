[project]
name = "pocket-assistant"
version = "0.1.0"
description = "Personal assistant: opportunity radar + inbox butler + tsundere desktop companion"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    # Gmail's certificate is checked against Windows' own store (gmail_imap._tls)
    "truststore>=0.10",
    # Only llm.py imports anthropic. 1.13 is the first release the adapter was checked against.
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
    # The local API. Plain uvicorn: uvloop, the [standard] extra's main gain, doesn't run on Windows.
    # Native server-sent events arrived in FastAPI 0.135.
    "fastapi>=0.162,<1",
    # 1.9 is the first TestClient that streams; earlier ones hang on an endless event stream
    "starlette>=1.9",
    "uvicorn>=0.54,<1",
    # Windows has no system time-zone database; needed for "midnight in HCMC"
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.16"]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
