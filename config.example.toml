# Copy this file to config.toml and edit it. config.toml is git-ignored.

[gmail]
# The inbox the assistant reads. Its App Password goes in Credential Manager: assistant set-key gmail
address = "you@gmail.com"
# Gmail search used by `assistant sync`. {days} is filled from --days.
# Excludes chat logs and spam/trash by default.
query = "newer_than:{days}d -in:chats -in:spam -in:trash"
# Safety cap so a first sync on a huge inbox doesn't run forever
max_messages = 500

[university]
# Your university address. Mail forwarded from Outlook keeps this in To:/Cc:,
# which is how we tag it as "university" without touching Outlook at all.
addresses = ["your.name@student.example.edu.vn"]

[storage]
db_path = "assistant.db"
# Bodies are kept only for Phase 1 extraction, truncated to this many characters
max_body_chars = 4000

[llm]
# Approved defaults (docs/phase1-plan.md, D1 and D4). Prices live in src/assistant/costs.py.
extract_model = "claude-haiku-5-5"   # reads every email: cheap and fast
digest_model = "claude-opus-5-5"     # writes the daily digest in Mika's voice
digest_effort = "low"                # low | medium | high | xhigh | max
monthly_soft_cap_usd = 5.0           # above it, only extraction runs; the digest uses the free template
daily_cap_usd = 1.0                  # above it, no model calls until tomorrow (catches runaway loops)
# Each cap must cover one digest's worst case ($0.68 with Opus 5.5), or loading the config fails.
# That much is only held while the digest call runs; a typical digest costs about $0.05.

[engine]
# `assistant engine` checks mail every 2 minutes and extracts it as it arrives.
# Emails read at the same time (1-8). Each is one model call in flight; the caps above still hold.
extract_workers = 4

[api]
# The local API that the dashboard and the chibi use. It listens on this PC only.
port = 47615
# To reach it from your laptop through Tailscale (see the README): this PC's name and your login.
# tailnet_host = "my-pc.tail1234.ts.net"
# tailnet_login = "you@gmail.com"

[dashboard]
# The "For you" tab shows open items scoring at least this much.
for_you_min_score = 60
