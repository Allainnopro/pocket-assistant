[project]
name = "pocket-assistant"
version = "0.1.0"
description = "Personal assistant: opportunity radar + inbox butler + tsundere desktop companion"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    # Only llm.py imports anthropic. 1.13 is the first release the adapter was checked against.
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
    # Windows has no system time-zone database; needed for "midnight in HCMC"
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
