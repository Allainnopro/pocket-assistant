name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    # The PC uses Windows (Credential Manager); the cloud engine runs on Ubuntu (secrets.json)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Offline by design: tests fake the keyring and refuse the network
      - run: pytest -q -p no:cacheprovider
